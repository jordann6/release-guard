# Platform layer for one environment: everything that is not a release.
# Applied once per environment by the operator (local: scripts/local/up.sh;
# AWS: the Flux bootstrap runbook). Releases never change these objects.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespaces.yaml
  - flux-tenant.yaml
  - flux-delivery.yaml
  - migrator.yaml
  - verifier.yaml
  - synthetic-traffic.yaml
components:
  - ../components/delivery-platform
images:
  - name: curl
    newName: curlimages/curl
    digest: sha256:935d9100e9ba842cdb060de42472c7ca90cfe9a7c96e4dacb55e79e560b3ff40 # 8.17.0
