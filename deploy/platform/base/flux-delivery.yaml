# Pull-based delivery (ADR-0003). The OCIRepository follows the highest 1.0.N
# deployment artifact; a rollback publishes a higher N with healthy content.
# Overlays set url, provider and insecure for the environment.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: orders-release
  namespace: orders
spec:
  interval: 30s
  url: oci://REPLACED-BY-OVERLAY
  ref:
    semver: ">=1.0.0"
  provider: generic
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: orders-migrate
  namespace: orders
spec:
  interval: 1m
  sourceRef:
    kind: OCIRepository
    name: orders-release
  path: ./migrate
  prune: true
  wait: true
  timeout: 5m
  serviceAccountName: orders-reconciler
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: orders-settings
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: orders-app
  namespace: orders
spec:
  interval: 1m
  dependsOn:
    - name: orders-migrate
  sourceRef:
    kind: OCIRepository
    name: orders-release
  path: ./app
  prune: true
  wait: true
  # Longer than a full canary: start, half the replicas, about 2 minutes of
  # analysis, then the rest (ADR-0009).
  timeout: 8m
  # kstatus does not understand Rollouts; these say when one is done or has failed.
  # An aborted canary (failed analysis or progress deadline) reports Degraded. Both
  # require the controller to have seen the current spec: right after a new release
  # is applied, the status still describes the previous one, which may have aborted.
  healthCheckExprs:
    - apiVersion: argoproj.io/v1alpha1
      kind: Rollout
      current: status.phase == 'Healthy' && status.observedGeneration == string(metadata.generation)
      failed: status.phase == 'Degraded' && status.observedGeneration == string(metadata.generation)
  serviceAccountName: orders-reconciler
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: orders-settings
