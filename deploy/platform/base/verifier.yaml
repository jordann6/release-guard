# The independent verifier (ADR-0006). Read-only in the cluster; in AWS its IRSA
# role may write only VERIFY# items in the deployment table (ADR-0004).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: verifier
  namespace: release-verifier
  annotations:
    eks.amazonaws.com/role-arn: REPLACED-BY-OVERLAY
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: release-verifier
  namespace: orders
rules:
  - apiGroups: [kustomize.toolkit.fluxcd.io]
    resources: [kustomizations]
    resourceNames: [orders-app, orders-migrate]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [orders-api]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: release-verifier
  namespace: orders
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: release-verifier
subjects:
  - kind: ServiceAccount
    name: verifier
    namespace: release-verifier
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: verifier
  namespace: release-verifier
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: release-verifier
  template:
    metadata:
      labels:
        app.kubernetes.io/name: release-verifier
    spec:
      serviceAccountName: verifier
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: verifier
          image: release-verifier
          env:
            - name: Verifier__Environment
              value: prod
            - name: Verifier__Table
              value: REPLACED-BY-OVERLAY
            - name: Verifier__Region
              value: us-east-1
            - name: Verifier__OrdersUrl
              value: http://orders-api.orders.svc.cluster.local
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
