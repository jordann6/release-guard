# Local environment (Phase 4): k3d, a plain-HTTP registry standing in for both
# ECR repositories, in-cluster PostgreSQL and DynamoDB Local. Database passwords
# are generated by scripts/local/up.sh into Secrets and never committed.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - data.yaml
images:
  - name: release-verifier
    newName: k3d-rg-registry:5000/release-guard/verifier
    newTag: local
configMapGenerator:
  # Substitution variables: role ARNs only.
  - name: orders-settings
    namespace: orders
    literals:
      - APP_ROLE_ARN=none
      - MIGRATOR_ROLE_ARN=none
  # Runtime settings read by the application and migration containers.
  - name: orders-runtime
    namespace: orders
    literals:
      - Database__UseIamAuthentication=false
      - Database__Region=us-east-1
generatorOptions:
  disableNameSuffixHash: true
patches:
  - target:
      kind: OCIRepository
      name: orders-release
    patch: |
      - op: replace
        path: /spec/url
        value: oci://k3d-rg-registry:5000/release-guard/deploy
      - op: add
        path: /spec/insecure
        value: true
  - target:
      kind: ServiceAccount
      name: verifier
    patch: |
      - op: replace
        path: /metadata/annotations/eks.amazonaws.com~1role-arn
        value: none
  - target:
      kind: Deployment
      name: verifier
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: release-guard-deployments
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: Verifier__DynamoEndpoint
          value: http://dynamodb.data.svc.cluster.local:8000
