apiVersion: batch/v1
kind: Job
metadata:
  name: orders-migrate
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orders-migrate
    spec:
      restartPolicy: Never
      serviceAccountName: orders-migrator
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: orders-api
          args: ["migrate"]
          envFrom:
            - configMapRef:
                name: orders-runtime
          env:
            - name: Database__ConnectionString
              valueFrom:
                secretKeyRef:
                  name: orders-db
                  key: migrator
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
