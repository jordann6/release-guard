# Migration step, applied before the application (orders-app dependsOn
# orders-migrate). releasectl appends a per-release nameSuffix so each
# release runs its own Job. Migrations are expand-only (ADR-0003).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: orders
resources:
  - serviceaccount.yaml
  - job.yaml
