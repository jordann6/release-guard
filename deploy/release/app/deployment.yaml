apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  labels:
    app.kubernetes.io/name: orders-api
spec:
  replicas: 2
  revisionHistoryLimit: 5
  # A rollout that cannot make progress in 4 minutes is reported as failed (ADR-0003).
  progressDeadlineSeconds: 240
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: orders-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orders-api
    spec:
      serviceAccountName: orders-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: orders-api
          image: orders-api
          ports:
            - name: http
              containerPort: 8080
          # Environment settings come from the platform layer as plain strings. Flux
          # variable substitution is used only for role ARNs: a substituted "false"
          # becomes a YAML boolean and the API rejects it.
          envFrom:
            - configMapRef:
                name: orders-runtime
          env:
            - name: Database__ConnectionString
              valueFrom:
                secretKeyRef:
                  name: orders-db
                  key: app
            - name: Orders__PaymentsEndpoint
              valueFrom:
                configMapKeyRef:
                  name: orders-runtime
                  key: Payments__Endpoint
            - name: Release__Version
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['release-guard/seq']
            - name: Release__Commit
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['release-guard/commit']
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
