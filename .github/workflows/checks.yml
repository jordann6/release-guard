name: Checks

# Every merge gate from ADR-0001, shared by pr.yml and verify-main.yml so both
# produce evidence from exactly the same checks. No job here holds AWS credentials
# or an id-token permission.
on:
  workflow_call:
    inputs:
      source:
        description: pull_request or verify-main.
        type: string
        required: true
      base_sha:
        description: Commit the change is compared against (PR base, or the previous main commit).
        type: string
        required: true
      head_sha:
        description: PR head commit, or the main commit being verified.
        type: string
        required: true
      pr_number:
        type: string
        default: ""
      contract_migration_approved:
        description: True when the PR carries the contract-migration label.
        type: boolean
        default: false

permissions:
  contents: read

env:
  CI: "true"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  TRIVY_VERSION: "0.76.0"
  TRIVY_SHA256: e24b1c51293c1b15e4ba8d45bbc7891ba053f90278ec2698f3562c993e145fe7

jobs:
  guardrails:
    uses: ./.github/workflows/guardrails.yml
    permissions:
      contents: read
      security-events: write

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet format --verify-no-changes --no-restore

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      # CI=true turns on locked-mode restore and makes analyzer warnings errors.
      - run: dotnet build --configuration Release

  unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet test --project tests/Orders.UnitTests --configuration Release

  integration-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet test --project tests/Orders.IntegrationTests --configuration Release

  migration-safety:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet tool restore
      - name: Self-test the checker
        run: scripts/tests/migration-safety.test.sh
      - name: Check migrations added since the base
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          CONTRACT_MIGRATION_APPROVED: ${{ inputs.contract_migration_approved }}
        run: scripts/migration-safety.sh --base "$BASE_SHA"

  n-minus-1:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      # Every main commit is a release candidate, so the base is the previous release.
      - name: Previous release's tests against this schema
        env:
          BASE_SHA: ${{ inputs.base_sha }}
        run: scripts/n-minus-1.sh "$BASE_SHA"

  sast:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: csharp
          build-mode: manual
          queries: security-extended
      - run: dotnet build --configuration Release
      - name: CodeQL analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:csharp
          output: sarif-results
      # Code scanning upload only reports. This step makes findings block the merge.
      - name: Fail on security findings
        run: python3 scripts/ci/sarif-gate.py sarif-results/*.sarif
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: codeql-sarif
          path: sarif-results
          retention-days: 90

  image-scan:
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      result: ${{ steps.summary.outputs.result }}
      report_sha256: ${{ steps.summary.outputs.report_sha256 }}
      high: ${{ steps.summary.outputs.high }}
      critical: ${{ steps.summary.outputs.critical }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Trivy (pinned, checksum verified)
        run: |
          curl -sSfL -o trivy.tgz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tgz" | sha256sum --check --strict
          sudo tar -xzf trivy.tgz -C /usr/local/bin trivy
          rm trivy.tgz
      - name: Check accepted risks have not expired
        run: scripts/ci/check-trivyignore.sh .trivyignore
      - name: Build image
        id: build
        run: |
          docker build --file src/Orders.Api/Dockerfile --tag orders-api:scan .
          echo "digest=$(docker image inspect --format '{{.Id}}' orders-api:scan)" >> "$GITHUB_OUTPUT"
      - name: Scan image (blocking)
        run: |
          trivy image --quiet --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --format json --output trivy.json orders-api:scan
          trivy convert --format table trivy.json
          trivy convert --format sarif --output trivy.sarif trivy.json
      - name: Summarize and enforce
        id: summary
        run: |
          high=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' trivy.json)
          critical=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy.json)
          result=pass
          if [ "$high" -gt 0 ] || [ "$critical" -gt 0 ]; then result=fail; fi
          {
            echo "high=$high"
            echo "critical=$critical"
            echo "result=$result"
            echo "report_sha256=$(sha256sum trivy.json | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"
          echo "Trivy: $critical critical, $high high (fixable only)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$result" = fail ]; then
            echo "::error::Image has $critical critical and $high high fixable vulnerabilities"
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: trivy-report
          path: |
            trivy.json
            trivy.sarif
          retention-days: 90

  evidence:
    # Runs even when a gate failed, then fails itself: a skipped required check
    # would otherwise count as passing.
    if: always()
    needs: [guardrails, format, build, unit-tests, integration-tests, migration-safety, n-minus-1, sast, image-scan]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Write evidence
        env:
          EVIDENCE_SOURCE: ${{ inputs.source }}
          PR_NUMBER: ${{ inputs.pr_number }}
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
          MERGE_REF_SHA: ${{ github.sha }}
          JOB_RESULTS: ${{ toJSON(needs) }}
          IMAGE_DIGEST: ${{ needs.image-scan.outputs.digest }}
          TRIVY_RESULT: ${{ needs.image-scan.outputs.result }}
          TRIVY_REPORT_SHA256: ${{ needs.image-scan.outputs.report_sha256 }}
          TRIVY_HIGH: ${{ needs.image-scan.outputs.high }}
          TRIVY_CRITICAL: ${{ needs.image-scan.outputs.critical }}
        run: python3 scripts/ci/write-pr-evidence.py pr-evidence.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success()
        with:
          name: pr-evidence
          path: pr-evidence.json
          retention-days: 90
