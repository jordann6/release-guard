name: Guardrails

# Generated by platform-guardrails install.sh --no-terraform, then adapted:
# - workflow_call instead of push/pull_request, so checks.yml can make the evidence
#   job depend on it (ADR-0001). It still runs on every PR, through checks.yml.
# - skip_container: this repository builds its image from the repository root and
#   runs its own blocking Trivy scan, which also records the scanned digest as
#   evidence. The shared container job builds from the Dockerfile's directory.
# This repository has no Terraform. Its infrastructure is the delivery root in
# aws-landing-zone, gated there by tf-ci.yml.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    uses: jordann6/platform-guardrails/.github/workflows/ci.yml@f3ac73cfd5dcc2d13491b6997c4796b1eb1c8656 # v1.4.0
    permissions:
      contents: read
      security-events: write
    with:
      skip_container: true
