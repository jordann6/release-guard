name: Rollback

# Recovery path (ADR-0006): allowed only after a failed or timed-out release. Pulls the
# last verified release's artifact and republishes it unchanged under the next version,
# so Flux converges to healthy content and does not reapply the failed release.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: "true"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  CONTRACT_PARAMETER: /delivery/release-guard/prod/contract

jobs:
  rollback:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/release-tools
        with:
          tools: flux
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.PROMOTE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: contract
        run: releasectl contract-check --source "ssm:$CONTRACT_PARAMETER" --stage promote --region "$AWS_REGION"
      - id: rollback
        env:
          TABLE: ${{ steps.contract.outputs.deployment_table }}
          DEPLOY_REPO: ${{ steps.contract.outputs.deploy_repository_url }}
        run: releasectl rollback --table "$TABLE" --region "$AWS_REGION" --deploy-repo "$DEPLOY_REPO" --provider aws
      - name: Wait for the verifier
        env:
          TABLE: ${{ steps.contract.outputs.deployment_table }}
          SEQ: ${{ steps.rollback.outputs.seq }}
        run: releasectl wait --table "$TABLE" --region "$AWS_REGION" --seq "$SEQ" --timeout 00:12:00
      - name: Record the release state
        if: always() && steps.contract.outcome == 'success'
        env:
          TABLE: ${{ steps.contract.outputs.deployment_table }}
        run: releasectl status --table "$TABLE" --region "$AWS_REGION"
